name: Déployer le backend (Hugging Face)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'tracer-haskell/**'
      - 'Dockerfile'
      - 'deploy/huggingface/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Le README du Space porte sa configuration (sdk: docker, app_port).
      - run: cp deploy/huggingface/README.md README.md
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_SPACE }}
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: docker
          exclude: |
            docs/**
            server/test/**
            web/src/**
            web/test/**
            web/index.html
